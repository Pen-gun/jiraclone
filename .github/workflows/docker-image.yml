name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:

  CI:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      name: Check out code

    - uses: mr-smithers-excellent/docker-build-push@v7
      name: Build & push Docker image
      with:
        image: project-management-inspired-by-jira
        tags: version1.0
        registry: ghcr.io
        dockerfile: ./Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

  CD:
    runs-on: ubuntu-latest
    needs: CI
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy over SSH via tailnet
        run: |
          ssh -o "StrictHostKeyChecking=no" ${{ secrets.REMOTE_SERVER }} << 'EOF'
          cd docker/project-management
          docker compose down
          docker compose pull
          docker compose up -d
          EOF